# Продакшен: самодостаточный стек — бот + свои Postgres 16 и Redis.
# Данные сохраняются в именованных томах, всё перезапускается автоматически.
#
# Перед запуском заполните .env (минимум BOT_TOKEN, ADMIN_IDS, POSTGRES_PASSWORD,
# PRODAMUS_*, ADMIN_WEB_*). Запуск:  docker compose up -d --build
# Логи:    docker compose logs -f bot
#
# Отличие от аналога club_bot: оплата Продамус подтверждается ВЕБХУКОМ, поэтому
# порт приёмника (8080) бота пробрасывается на 127.0.0.1 — снаружи его проксирует
# системный Nginx (dolbikfit.ru/prodamus/webhook). Админка — тоже за Nginx (/).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    # Внутренние адреса БД/Redis — по именам сервисов (переопределяют .env).
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-postgres}
      REDIS_URL: redis://redis:6379/0
    # Приёмник вебхука Продамуса (aiohttp в процессе бота, порт 8080) — только на
    # localhost; наружу проксирует Nginx на https://dolbikfit.ru/prodamus/webhook.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # Веб-админка (этап 6). Слушает только на localhost:8011 — наружу проксирует
  # системный Nginx (dolbikfit.ru, https). Миграции применяет сервис bot;
  # админка ждёт появления таблицы admin_users. Логин/секрет — из .env (ADMIN_WEB_*).
  admin:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-postgres}
      REDIS_URL: redis://redis:6379/0
    command: ["uvicorn", "src.webadmin.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8011:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
  redisdata:

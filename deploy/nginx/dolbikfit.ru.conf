# Nginx-конфиг прод-стека maria_doll (@Fit_it_bot).
# Один домен dolbikfit.ru обслуживает ДВА апстрима:
#   /prodamus/webhook  → бот, приёмник вебхука Продамуса (127.0.0.1:8080)
#   /                  → веб-админка (127.0.0.1:8011)
#
# Установка на сервере (Ubuntu, системный Nginx):
#   1) cp deploy/nginx/dolbikfit.ru.conf /etc/nginx/sites-available/dolbikfit.ru
#   2) ln -sf /etc/nginx/sites-available/dolbikfit.ru /etc/nginx/sites-enabled/
#   3) rm -f /etc/nginx/sites-enabled/default
#   4) nginx -t && systemctl reload nginx
#   5) certbot --nginx -d dolbikfit.ru -d www.dolbikfit.ru   # допишет 443 + редирект
#
# До запуска certbot активен только HTTP-блок ниже (нужен и для ACME-проверки).

server {
    listen 80;
    listen [::]:80;
    server_name dolbikfit.ru www.dolbikfit.ru;

    # Загрузка фото в рассылке из админки — поднимаем лимит тела запроса.
    client_max_body_size 25m;

    # Вебхук Продамуса — на приёмник бота. Точный префикс, до общего location /.
    location /prodamus/webhook {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Всё остальное — веб-админка.
    location / {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
